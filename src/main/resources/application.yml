spring:
  mail:
    host: smtp.gmail.com          # 구글 SMTP 서버 주소
    port: 587                     # 구글 SMTP 포트 번호
    username: whtpdnd200@gmail.com  # 사용자 이메일
    password: ${gmail.password} # 사용자 앱 비밀번호
    properties:
      mail:
        smtp:
          auth: true              # 사용자 인증 여부
          timeout: 5000           # 이메일 전송 타임아웃 시간
          starttls:
            enable: true          # TLS를 통해 안전한 통신 사용 여부
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  application:
    name: WeekEnd
  config:
    import: security-variable.yml
  thymeleaf:
    cache: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/week_end?serverTimezone=Asia/Seoul
    username: root
    password: ${mysql.password}
