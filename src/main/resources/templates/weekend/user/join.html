<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/user/join/style.css">
</head>
<body>
    <div id="wrap" class="">
        <header class="d-flex justify-content-center align-items-center border">
            <h1>WeekEnd</h1>
        </header>
        <section class="contents d-flex justify-content-center">
            <div class="user-box my-1 p-5">
                <h1 class="text-center">회원 가입</h1>
                <div class="d-flex align-items-center">
                    <input type="text" class="form-control my-3 col-8" placeholder="아이디" id="idInput">
                    <button id="duplicateBtn" type="button" class="btn btn-secondary ml-3">중복확인</button>
                </div>
                <input type="password" class="form-control mt-1 mb-3" placeholder="비밀번호" id="passwordInput">
                <input type="password" class="form-control my-3" placeholder="비밀번호 확인" id="passwordConfirmInput">
                <div id="passwordUnChecked" class="text-danger small d-none">비밀번호가 일치하지 않습니다!</div>
                <div id="passwordChecked" class="text-success small d-none">비밀번호가 일치 합니다</div>
                <input type="text" class="form-control my-3" placeholder="이름" id="nameInput">
                <input type="text" class="form-control my-3" placeholder="이메일" id="emailInput">
                <button type="button" class="btn btn-info btn-block my-3" id="joinBtn">회원가입</button>
                <div class="d-flex justify-content-center">
                    <a href="/user/login" class="text-center">로그인</a>
                </div>
            </div>
        </section>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>

        var isDuplicate = true;

        $("#passwordConfirmInput").on("input", function() {
            let password = $("#passwordInput").val();
            let passwordConfirm = $("#passwordConfirmInput").val();
            if(password != passwordConfirm) {
                $("#passwordUnChecked").removeClass("d-none");
                $("#passwordChecked").addClass("d-none");
            } else {
                $("#passwordUnChecked").addClass("d-none");
                $("#passwordChecked").removeClass("d-none");
            }
        });

        $("#duplicateBtn").on("click", function() {
            let id = $("#idInput").val();

            if(id == "") {
                alert("아이디를 입력하세요");
                $("#idInput").focus();
                return;
            }

            if(id.includes("-") || id.includes("`") || id.includes("'")) {
                alert("특수문자는 사용 할 수없습니다!");
                $("#idInput").val("");
                $("#idInput").focus();
                return;
            }

            $.ajax({
                type:"get"
                , url:"/user/duplicate-check"
                , data:{"id":id}
                , success:function(response) {
                    if(response.isDuplicate) {
                        alert("중복 된 아이디 입니다 다시 입력 해주세요!");
                        $("#idInput").val("");
                        $("#idInput").focus();
                    } else {
                        isDuplicate = false;
                        alert("사용 가능한 아이디 입니다");
                    }
                }
                , error:function() {
                    alert("중복확인 에러!");
                }
            });

        });

        $("#joinBtn").on("click", function (){

            let id = $("#idInput").val();
            let password = $("#passwordInput").val();
            let passwordConfirm = $("#passwordConfirmInput").val();
            let name = $("#nameInput").val();
            let email = $("#emailInput").val();

            if(id == "") {
                alert("아이디를 입력하세요");
                $("#idInput").focus();
                return;
            }

            if(id.includes("-") || id.includes("`") || id.includes("'")) {
                alert("특수문자는 사용 할 수없습니다!");
                $("#idInput").val("");
                $("#idInput").focus();
                return;
            }

            if(password == "") {
                alert("비밀번호를 입력하세요");
                $("#passwordInput").focus();
                return;
            }

            if(password != passwordConfirm) {
                alert("비밀번호가 일치하지 않습니다");
                $("#passwordConfirmInput").focus();
                return;
            }

            if(name == "") {
                alert("이름을 입력하세요");
                $("#nameInput").focus();
                return;
            }
            if(email == "") {
                alert("이메일을 입력하세요");
                $("#emailInput").focus();
                return;
            }

            if(isDuplicate) {
                alert("아이디 중복검사를 진행 해주세요!");
                return;
            }
            $.ajax({
                type:"post"
                , url:"/user/join-process"
                , data:{"memberId":id
                        ,"password":password
                        , "name":name
                        , "email":email
                }
                , success: function(response){
                    if(response.result == "success") {
                        location.href = "/user/login";
                    } else {
                        alert("회원가입 실패입니다!");
                    }
                }
                , error: function() {
                    alert("회원가입 에러!!");
                }
            });
        });
    </script>
</body>
</html>
