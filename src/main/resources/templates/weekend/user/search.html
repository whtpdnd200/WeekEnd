<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{weekend/layouts/default}">

    <div layout:fragment="contents">
        <div class="text-center mt-3">
            <h3>아이디 찾기</h3>
            <div class="text-center d-flex justify-content-center">
                <div class="mt-3 d-flex align-items-center justify-content-center w-75">
                    <input type="text" id="frontEmail" class="form-control col-5" placeholder="이메일 입력">
                    <span class="col-1">@</span>
                    <select id="emailSelect" class="form-control col-4">
                        <option value="self">- 직접입력 -</option>
                        <option>naver.com</option>
                        <option>gmail.com</option>
                        <option>daum.net</option>
                    </select>
                    <input type="text" id="backEmail" class="form-control col-4 d-none">
                    <button id="userIdSearchBtn" class="btn btn-secondary ml-3" type="button">전송</button>
                </div>
            </div>
            <div id="searchId" class="d-none"></div>
            <br>
            <h3>비밀번호 찾기</h3>
            <div class="text-center d-flex justify-content-center">
                <div class="mt-3 w-75">
                    <div>
                        <input type="text" class="form-control" id="userIdInput" placeholder="아이디 입력">
                    </div>
                    <div class="d-flex align-items-center justify-content-center mt-3">
                        <input type="text" id="frontEmailPassword" class="form-control col-5" placeholder="이메일 입력">
                        <span class="col-1">@</span>
                        <select id="emailSelectPassword" class="form-control col-4">
                            <option value="self">- 직접입력 -</option>
                            <option>naver.com</option>
                            <option>gmail.com</option>
                            <option>daum.net</option>
                        </select>
                        <input type="text" id="backEmailPassword" class="form-control col-4 d-none">
                        <button id="userPasswordSearchBtn" class="btn btn-secondary ml-3" type="button">전송</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script layout:fragment="script">

        $("#emailSelectPassword").on("change", function() {

            let value = $("#emailSelectPassword").val();

            if(value == 'self') {
                $(this).addClass("d-none");
                $("#backEmailPassword").removeClass("d-none");
            }
        });

        $("#userPasswordSearchBtn").on("click", function() {

            let memberId = $("#userIdInput").val();
            let frontEmail = $("#frontEmailPassword").val();
            let backEmail;

            if(memberId == '') {
                alert("아이디를 입력하세요!");
                $("#userIdInput").focus();
                return;
            }

            if($("#emailSelectPassword").hasClass("d-none")) {
                backEmail = $("#backEmailPassword").val();
            } else {
                backEmail = $("#emailSelectPassword").val();
            }

            console.log(backEmail);

            if(frontEmail == '') {
                alert("이메일을 입력 해주세요!");
                $("#frontEmailPassword").focus();
                return;
            }

            if(backEmail == '') {
                alert("이메일을 입력 해주세요!");
                $("#backEmailPassword").focus();
                return;
            }

            if(backEmail == 'self') {
                alert("이메일을 선택 해주세요!");
                return;
            }

            let email = frontEmail + '@' + backEmail;


            $.ajax({
                type:"get"
                , url:"/password-reset/send-email"
                , data:{"memberId":memberId, "email":email}
                , success:function(response) {
                    if(response.result == "success") {
                        alert("입력하신 이메일로 링크를 전송 해드렸습니다");
                    } else {
                        alert("메일 전송 실패!");
                    }
                }
                , error:function() {
                    alert("메일 전송 에러!");
                }
            });
        });

        $("#emailSelect").on("change", function() {

            let value = $("#emailSelect").val();

            if(value == 'self') {
                $(this).addClass("d-none");
                $("#backEmail").removeClass("d-none");
            }
        });

        $("#userIdSearchBtn").on("click", function() {
            let frontEmail = $("#frontEmail").val();
            let backEmail;

            if($("#emailSelect").hasClass("d-none")) {
                backEmail = $("#backEmail").val();
            } else {
                backEmail = $("#emailSelect").val();
            }

            console.log(backEmail);

            if(frontEmail == '') {
                alert("이메일을 입력 해주세요!");
                $("#frontEmail").focus();
                return;
            }

            if(backEmail == '') {
                alert("이메일을 입력 해주세요!");
                $("#backEmail").focus();
                return;
            }

            if(backEmail == 'self') {
                alert("이메일을 선택 해주세요!");
                return;
            }

            let email = frontEmail + '@' + backEmail;
            console.log(email);

            $.ajax({
                type:"get"
                , url:"/user/search-process"
                , data:{"email":email}
                , success:function(response) {
                    if(response.result == 'success') {
                        console.log(response);

                        $("#searchId").text("회원님의 아이디는 " + response.id + " 입니다.");
                        $("#searchId").removeClass("d-none");

                    } else {
                        alert("이메일 전송 실패!");
                    }
                }
                , error:function() {
                    alert("이메일 전송 에러!");
                }
            });
        });
    </script>
</html>
