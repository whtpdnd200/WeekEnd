<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{weekend/layouts/default}">
<head>
    <meta charset="UTF-8">
    <title>회원정보 수정</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/user/modify/style.css">
</head>
<body>

        <section layout:fragment="contents" class="contents d-flex justify-content-center">
            <div class="user-box my-1 p-5">
                <h1 class="text-center">회원정보 수정</h1>
                <input type="password" class="form-control my-3" placeholder="비밀번호" id="passwordInput">
                <input type="password" class="form-control my-3" placeholder="비밀번호 확인" id="passwordConfirmInput">
                <div id="passwordUnChecked" class="text-danger small d-none">비밀번호가 일치하지 않습니다!</div>
                <div id="passwordChecked" class="text-success small d-none">비밀번호가 일치 합니다</div>
                <img width="450px" height="300px" th:if="${session.userInfo.profileImage != null && session.userInfo.profileImage != ''}" th:src="${session.userInfo.profileImage}">
                <input type="file" class="my-3" id="imageInput">
                <input th:value="${session.userInfo.getName()}"  type="text" class="form-control my-3" placeholder="이름" id="nameInput">
                <input th:value="${session.userInfo.getEmail()}" type="text" class="form-control my-3" placeholder="이메일" id="emailInput">
                <button id="modifyBtn" class="btn btn-block btn-secondary my-3" type="button">정보 수정</button>
            </div>
        </section>

    <script layout:fragment="script">

        var images = [".jpeg"
            , ".jpg"
            , ".png"
            , ".webp"]

        $("#modifyBtn").on("click", function (){

            let password = $("#passwordInput").val();
            let passwordConfirm = $("#passwordConfirmInput").val();
            let name = $("#nameInput").val();
            let email = $("#emailInput").val();
            let profileImage = $("#imageInput")[0].files[0];
            let dotName = "";

            if(profileImage != undefined)
            {
                dotName = profileImage.name.substring(profileImage.name.lastIndexOf("."));
            }

            if(profileImage != undefined && !images.includes(dotName)) {
                alert("이미지 파일만 업로드 가능 합니다!");
                return;
            }

            if(password == "") {
                alert("비밀번호를 입력하세요");
                $("#passwordInput").focus();
                return;
            }

            if(password != passwordConfirm) {
                alert("비밀번호가 일치하지 않습니다");
                $("#passwordConfirmInput").focus();
                return;
            }

            if(name == "") {
                alert("이름을 입력하세요");
                $("#nameInput").focus();
                return;
            }
            if(email == "") {
                alert("이메일을 입력하세요");
                $("#emailInput").focus();
                return;
            }

            let formData = new FormData();
            formData.append("password", password);
            formData.append("email", email);
            formData.append("name", name);
            formData.append("profileImage", profileImage);

            $.ajax({
                type:"put"
                , processData:false
                , contentType:false
                , url:"/user/modify-process"
                , data:formData
                , success:function(response) {
                    if(response.result == "success") {
                        location.reload();
                    } else {
                        alert("회원 정보 수정 실패!");
                    }
                }
                , error:function() {
                    alert("회원 정보 수정 에러!");
                }
            });
        });

        $("#passwordConfirmInput").on("input", function() {
            let password = $("#passwordInput").val();
            let passwordConfirm = $("#passwordConfirmInput").val();
            if(password != passwordConfirm) {
                $("#passwordUnChecked").removeClass("d-none");
                $("#passwordChecked").addClass("d-none");
            } else {
                $("#passwordUnChecked").addClass("d-none");
                $("#passwordChecked").removeClass("d-none");
            }
        });
    </script>
</body>
</html>
