<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{weekend/layouts/default}">
<head>
    <meta charset="UTF-8">
    <title>글 수정</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/post/write/style.css">
</head>
    <section layout:fragment="contents">
        <h2 class="text-center mt-2">글 수정</h2>
        <input th:data-id="${post.id}" id="idHiddenInput" type="hidden" >
        <textarea th:text="${post.contents}" rows="10" class="form-control my-2" id="contentsInput"></textarea>
        <img width="450px" height="300px" th:if="${post.imagePath != '' && post.imagePath != null}" th:src="${post.imagePath}">
        <input type="file" class="my-2" id="fileInput">
        <button type="button" class="btn btn-info btn-block my-2" id="modifyBtn">수정</button>
    </section>

    <script layout:fragment="script">

        var images = [".jpeg"
            , ".jpg"
            , ".png"
            , ".webp"]

        $("#modifyBtn").on("click", function() {
            let id = $("#idHiddenInput").data("id");
            let contents = $("#contentsInput").val();
            let imageFile = $("#fileInput")[0].files[0];

            let dotName = "";

            if(imageFile != undefined)
            {
                dotName = imageFile.name.substring(imageFile.name.lastIndexOf("."));
            }


            if(contents == "") {
                alert("내용을 입력하세요!");
                $("#contentsInput").focus();
                return;
            }

            if(imageFile != undefined && !images.includes(dotName)) {
                alert("이미지 파일만 업로드 가능 합니다!");
                return;
            }



            let formData = new FormData();
            formData.append("id", id);
            formData.append("contents", contents);
            formData.append("imageFile", imageFile);


            $.ajax({
                type:"put"
                , processData:false
                , contentType:false
                , url:"/post/modify-process"
                , data:formData
                ,success:function(response) {
                    if(response.result == "success") {
                        location.href = "/post/list";
                    } else {
                        alert("글 수정 실패!");
                    }
                }
                , error:function() {
                    alert("글 수정 에러!");
                }
            });
        });
    </script>
</html>
