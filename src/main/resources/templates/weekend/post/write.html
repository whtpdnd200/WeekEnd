<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{weekend/layouts/default}">
<head>
    <meta charset="UTF-8">
    <title>글 작성</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/post/write/style.css">
</head>

    <section layout:fragment="contents">
        <h2 class="text-center mt-2">글 작성</h2>
        <textarea rows="10" class="form-control my-2" id="contentsInput"></textarea>
        <input type="file" class="my-2" id="fileInput">
        <button type="button" class="btn btn-info btn-block my-2" id="writeBtn">작성</button>
    </section>

    <script layout:fragment="script">
        $("#writeBtn").on("click", function() {
            let contents = $("#contentsInput").val();
            let image = $("#fileInput").val();

            if(contents == "") {
                alert("내용을 입력하세요!");
                $("#contentsInput").focus();
                return;
            }

            $.ajax({
                type:"post"
                , url:"/post/write-process"
                , data:{"contents" : contents, "imagePath" : image}
                ,success:function(response) {
                    if(response.result == "success") {
                        location.href = "/post/list";
                    } else {
                        alert("글 작성 실패!");
                    }
                }
                , error:function() {
                    alert("글 작성 에러!");
                }
            });
        });
    </script>
</html>
